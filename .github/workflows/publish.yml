name: publish-to-github-pages
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Setup pnpm 📦
              uses: pnpm/action-setup@v4

            - name: Setup Node.js ⚙️
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies 🔧
              run: pnpm install --frozen-lockfile

            # Non-main refs build for the *.github.io project URL so the
            # branch can be test-deployed without touching the custom domain.
            - name: Build with Astro 🏗️
              run: pnpm build
              env:
                  ASTRO_SITE: ${{ github.ref_name != 'main' && format('https://{0}.github.io', github.repository_owner) || '' }}
                  ASTRO_BASE: ${{ github.ref_name != 'main' && format('/{0}', github.event.repository.name) || '' }}

            - name: Drop CNAME on test deploys 🧪
              if: github.ref_name != 'main'
              run: rm -f dist/CNAME

            - name: Upload artifact 📡
              uses: actions/upload-pages-artifact@v3
              with:
                  name: "github-pages"
                  path: ./dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Publish to GitHub Pages 🚀
              id: deployment
              uses: actions/deploy-pages@v4
